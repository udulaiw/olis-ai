<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="OLIS AI (Orbix Learning Intelligence System): your intelligent learning workspace. Beta, by UDULAIW." />
    <meta name="author" content="UDULAIW" />
    <meta property="og:title" content="OLIS AI · Beta" />
    <meta property="og:description" content="Your intelligent learning workspace. An AI research tutor that explains, solves, plans and quizzes, with cited sources." />
    <meta property="og:image" content="/olis-og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0e0f12" />
    <link rel="icon" type="image/svg+xml" href="/olis.svg" />
    <title>OLIS AI · Beta</title>
    <script>
      // Apply saved theme before first paint (avoids a flash of the wrong theme)
      try {
        var t = JSON.parse(localStorage.getItem("olis.settings") || "{}").theme || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
